<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MO Steel – Bonificação da Obra</title>
<style>
:root{
  color-scheme:light;
  --bg:#f4f4f2; --surface-1:#fcfcfb; --border:#e3e2de; --grid:#ecebe7;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#7a7975;
  --series-1:#2a78d6; --series-2:#eb6834; --accent:#1f3864; --good:#0f7b3f; --warn:#a36a00;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#121211; --surface-1:#1a1a19; --border:#2c2c2a; --grid:#262624;
    --text-primary:#f0efec; --text-secondary:#c3c2b7; --text-muted:#8f8e86;
    --series-1:#3987e5; --series-2:#d95926; --accent:#9db8ec; --good:#4cc07f; --warn:#e2a93b;
  }
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text-primary);-webkit-font-smoothing:antialiased}
header{background:var(--surface-1);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.bar{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:-.01em;margin-right:auto}
.brand small{display:block;font-weight:400;color:var(--text-muted);font-size:12px}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav a{padding:7px 12px;border-radius:999px;border:1px solid var(--border);color:var(--text-secondary);text-decoration:none;font-size:14px}
nav a.on{background:var(--text-primary);color:var(--surface-1);border-color:var(--text-primary)}
main{max-width:1180px;margin:0 auto;padding:20px}
h1{font-size:26px;margin:4px 0 2px;letter-spacing:-.02em}
.sub{color:var(--text-secondary);margin:0 0 18px;font-size:14px}
.grid{display:grid;gap:14px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.two{grid-template-columns:1.4fr 1fr}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:16px}
.tile .k{font-size:12px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.04em}
.tile .v{font-size:26px;font-weight:700;margin-top:6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .n{font-size:12px;color:var(--text-muted);margin-top:4px}
.tile.hero{background:var(--accent);border-color:var(--accent)}
.tile.hero .k,.tile.hero .n{color:var(--surface-1);opacity:.85}.tile.hero .v{color:var(--surface-1)}
h2{font-size:15px;margin:0 0 2px}
.cap{font-size:12px;color:var(--text-muted);margin:0 0 10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text-secondary);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{fill:var(--text-muted);font-size:11px;font-family:inherit}
.tip{position:fixed;pointer-events:none;background:var(--text-primary);color:var(--surface-1);font-size:12px;padding:8px 10px;border-radius:8px;opacity:0;transition:opacity .08s;z-index:20;white-space:nowrap;line-height:1.5}
.tip b{font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:600;color:var(--text-secondary);font-size:12px;border-bottom:1px solid var(--border);padding:8px 6px}
td{border-bottom:1px solid var(--grid);padding:8px 6px}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}tr.click:hover td{background:var(--grid)}
.meter{height:10px;background:var(--grid);border-radius:999px;overflow:hidden;margin:6px 0 4px}
.meter span{display:block;height:100%;background:var(--series-1);border-radius:999px}
.row{display:flex;justify-content:space-between;font-size:13px}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--border);color:var(--text-secondary)}
.pill.good{color:var(--good);border-color:currentColor}.pill.warn{color:var(--warn);border-color:currentColor}
.formula{font-size:13px;color:var(--text-secondary);line-height:1.7}
.formula b{color:var(--text-primary)}
.mt{margin-top:14px}
footer{max-width:1180px;margin:10px auto 30px;padding:0 20px;font-size:12px;color:var(--text-muted)}
details summary{cursor:pointer;font-size:13px;color:var(--text-secondary)}
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand" id="brand"></div>
  <nav id="nav"></nav>
</div></header>
<main id="app"></main>
<footer id="foot"></footer>
<div class="tip" id="tip"></div>
<script src="data.js"></script>
<script>
const DATA = window.DATA;
const $ = s => document.querySelector(s);
const brl = v => (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const kg = v => (v||0).toLocaleString('pt-BR',{maximumFractionDigits:0})+' kg';
const pct = v => Math.round((v||0)*100)+'%';
const dd = s => { const [y,m,d]=s.split('-'); return d+'/'+m; };
const slug = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tip = $('#tip');
function showTip(e,html){ tip.innerHTML=html; tip.style.opacity=1; const w=tip.offsetWidth; let x=e.clientX+14; if(x+w>innerWidth-8) x=e.clientX-w-14; tip.style.left=x+'px'; tip.style.top=(e.clientY+14)+'px'; }
function hideTip(){ tip.style.opacity=0; }

let PER, D, N, P, teamMont, teamLev;
function setPeriod(id){
  PER = DATA.periodos.find(x=>x.id===id) || DATA.periodos[0];
  D = PER.dias; N = D.length; P = PER.prod;
  teamMont = D.map((_,i)=>P.Parede.mont[i]+P.Cobertura.mont[i]);
  teamLev  = D.map((_,i)=>P.Parede.lev[i]+P.Cobertura.lev[i]);
}
function niceMax(v){ if(v<=0) return 1; const e=Math.pow(10,Math.floor(Math.log10(v))); const n=v/e; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*e; }

/* ---------- charts ---------- */
function groupedBars(el, series, fmt){
  const W=720,H=260,m={l:52,r:8,t:10,b:28}, iw=W-m.l-m.r, ih=H-m.t-m.b;
  const max=niceMax(Math.max(...series.flatMap(s=>s.values)));
  const band=iw/N, gap=2, bw=Math.max(3,Math.min(18,(band*0.72-gap)/series.length));
  const y=v=>m.t+ih-(v/max)*ih;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Produção diária">`;
  for(let k=0;k<=4;k++){const v=max*k/4; s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${m.l-8}" y="${y(v)+4}" text-anchor="end">${(v).toLocaleString('pt-BR')}</text>`;}
  D.forEach((d,i)=>{
    const cx=m.l+band*i+band/2, x0=cx-(bw*series.length+gap*(series.length-1))/2;
    series.forEach((se,j)=>{ const v=se.values[i]; if(v>0){ const x=x0+j*(bw+gap), yy=y(v), h=m.t+ih-yy, r=Math.min(4,bw/2,h);
      s+=`<path d="M${x},${m.t+ih}V${yy+r}q0,-${r} ${r},-${r}h${bw-2*r}q${r},0 ${r},${r}V${m.t+ih}Z" fill="${se.color}"/>`; }});
    if(N<=20||i%2===0) s+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${dd(d)}</text>`;
    s+=`<rect class="hit" data-i="${i}" x="${m.l+band*i}" y="${m.t}" width="${band}" height="${ih}" fill="transparent"/>`;
  });
  s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${m.t+ih}" y2="${m.t+ih}" stroke="var(--text-muted)" stroke-opacity=".5"/></svg>`;
  el.innerHTML=s;
  el.querySelectorAll('.hit').forEach(r=>{ const i=+r.dataset.i;
    r.addEventListener('mousemove',e=>{ r.setAttribute('fill','var(--grid)'); r.setAttribute('fill-opacity','.6'); r.parentNode.insertBefore(r, r.parentNode.firstChild.nextSibling);
      showTip(e,`<b>${dd(D[i])}</b><br>`+series.map(se=>`<span style="color:${se.color}">■</span> ${se.name}: <b>${fmt(se.values[i])}</b>`).join('<br>')); });
    r.addEventListener('mouseleave',()=>{ r.setAttribute('fill','transparent'); hideTip(); });
  });
}
function lineChart(el, values, color, fmt, label){
  const W=720,H=240,m={l:64,r:16,t:14,b:28}, iw=W-m.l-m.r, ih=H-m.t-m.b;
  const max=niceMax(Math.max(...values));
  const x=i=>m.l+(N===1?iw/2:iw*i/(N-1)), y=v=>m.t+ih-(v/max)*ih;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}">`;
  for(let k=0;k<=4;k++){const v=max*k/4; s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${m.l-8}" y="${y(v)+4}" text-anchor="end">${brl(v).replace(',00','')}</text>`;}
  D.forEach((d,i)=>{ if(N<=20||i%2===0) s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${dd(d)}</text>`; });
  const pts=values.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  s+=`<polygon points="${m.l},${m.t+ih} ${pts} ${x(N-1)},${m.t+ih}" fill="${color}" fill-opacity=".10"/>`;
  s+=`<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>`;
  const last=values[N-1]; s+=`<circle cx="${x(N-1)}" cy="${y(last)}" r="4.5" fill="${color}" stroke="var(--surface-1)" stroke-width="2"/>`;
  s+=`<text x="${x(N-1)-8}" y="${y(last)-10}" text-anchor="end" style="fill:var(--text-primary);font-weight:600;font-size:12px">${fmt(last)}</text>`;
  s+=`<line id="xh" x1="0" x2="0" y1="${m.t}" y2="${m.t+ih}" stroke="var(--text-muted)" stroke-dasharray="3 3" opacity="0"/><circle id="xd" r="5" fill="${color}" stroke="var(--surface-1)" stroke-width="2" opacity="0"/>`;
  s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${m.t+ih}" y2="${m.t+ih}" stroke="var(--text-muted)" stroke-opacity=".5"/>`;
  s+=`<rect id="hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
  el.innerHTML=s;
  const svg=el.querySelector('svg'), xh=svg.querySelector('#xh'), xd=svg.querySelector('#xd');
  svg.querySelector('#hit').addEventListener('mousemove',e=>{
    const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; const p=pt.matrixTransform(svg.getScreenCTM().inverse());
    const i=Math.max(0,Math.min(N-1,Math.round((p.x-m.l)/iw*(N-1))));
    xh.setAttribute('x1',x(i)); xh.setAttribute('x2',x(i)); xh.setAttribute('opacity',1);
    xd.setAttribute('cx',x(i)); xd.setAttribute('cy',y(values[i])); xd.setAttribute('opacity',1);
    const prev=i?values[i-1]:0;
    showTip(e,`<b>${dd(D[i])}</b><br>${label}: <b>${fmt(values[i])}</b><br>No dia: <b>${fmt(values[i]-prev)}</b>`);
  });
  svg.querySelector('#hit').addEventListener('mouseleave',()=>{xh.setAttribute('opacity',0);xd.setAttribute('opacity',0);hideTip();});
}
function hbars(el, rows, color){
  if(!rows.length){ el.innerHTML='<p class="cap">Sem produção bonificada no período.</p>'; return; }
  const max=Math.max(...rows.map(r=>r.valor)), rh=34, W=520, lw=0, H=rows.length*rh;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bônus por serviço">`;
  rows.forEach((r,i)=>{ const y=i*rh, w=Math.max(4,(W-110)*r.valor/max);
    s+=`<text x="0" y="${y+11}" style="fill:var(--text-secondary);font-size:12px">${esc(r.nome)}</text>`;
    s+=`<path d="M0,${y+16}h${w-4}q4,0 4,4v6q0,4 -4,4h-${w-4}Z" fill="${color}"/>`;
    s+=`<text x="${w+8}" y="${y+28}" style="fill:var(--text-primary);font-weight:600;font-size:12px">${brl(r.valor)}</text>`;
    s+=`<rect class="hb" data-i="${i}" x="0" y="${y}" width="${W}" height="${rh}" fill="transparent"/>`;
  });
  el.innerHTML=s+'</svg>';
  el.querySelectorAll('.hb').forEach(h=>{ const r=rows[+h.dataset.i];
    h.addEventListener('mousemove',e=>showTip(e,`<b>${esc(r.nome)}</b><br>${r.qtd.toLocaleString('pt-BR',{maximumFractionDigits:1})} ${r.un} × ${r.rate.toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:3})}/${r.un}<br>= <b>${brl(r.valor)}</b>`));
    h.addEventListener('mouseleave',hideTip); });
}
function progress(){
  return ['Parede','Cobertura'].map(g=>{ const o=DATA.obraStatus[g];
    return `<div class="mt"><div class="row"><b>${g}</b><span>${pct(o.lev/o.total)} levantado</span></div>
    <div class="meter" title="${kg(o.lev)} de ${kg(o.total)}"><span style="width:${(o.lev/o.total*100).toFixed(1)}%"></span></div>
    <div class="row cap"><span>${o.n} peças · ${kg(o.total)}</span><span>montado ${pct(o.mont/o.total)}</span></div></div>`; }).join('');
}
const legend = items => `<div class="legend">${items.map(([n,c])=>`<span><i style="background:${c}"></i>${n}</span>`).join('')}</div>`;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const tile = (k,v,n,hero) => `<div class="card tile${hero?' hero':''}"><div class="k">${k}</div><div class="v">${v}</div>${n?`<div class="n">${n}</div>`:''}</div>`;
const desempPill = d => `<span class="pill ${d==='Boa'?'good':'warn'}">${esc(d||'-')}</span>`;

/* ---------- pages ---------- */
const pago = () => PER.tipo==='pago';
const sum = (a,k) => a.reduce((s,x)=>s+(x[k]||0),0);
const sinal = v => (v>=0?'+':'−')+brl(Math.abs(v));
function avisoPeriodo(){
  return pago()
   ? `<div class="card mt formula"><b>Pagamento de 05/11 (Construtora Neto Lara):</b> considerou a produção <b>até 08/11</b>, incluindo o fim de semana. Foram pagas as <b>paredes</b>: panelização, elevação e fixação de 281,51 m², e os valores acima são exatamente os pagos. Até 08/11 a equipe também executou <b>${kg(sumArr(P.Cobertura.mont))} de treliças/tesouras montadas</b> e <b>${kg(sumArr(P.Cobertura.lev))} de cobertura içada</b>, que ainda não foram pagos e <b>entram no pagamento de 05/12</b>.</div>`
   : `<div class="card mt formula"><b>2º pagamento em andamento:</b> produção de 09/11 até hoje, a ser paga pela Construtora Neto Lara em 05/12 (corte em 30/11). Soma-se a cobertura executada até 08/11 que ainda não foi paga. Presença e desempenho considerados 100% até o fechamento.</div>`;
}
const sumArr = a => a.reduce((x,y)=>x+y,0);
function pageEquipe(){
  const ps=PER.pessoas, lev=sumArr(teamLev), mon=sumArr(teamMont), calc=sum(ps,'calcKg');
  const tiles = pago()
   ? tile('Total pago em 05/11',brl(sum(ps,'salario')+sum(ps,'pago')),`salários ${brl(sum(ps,'salario'))} + bônus ${brl(sum(ps,'pago'))}`,true)+tile('Bônus pago (paredes)',brl(sum(ps,'pago')),'= produção das paredes até 08/11')+tile('Executado e ainda não pago',brl(sum(ps,'saldo')),'cobertura · entra em 05/12')
   : tile('Bônus a pagar em 05/12 (até agora)',brl(sum(ps,'aPagar')),'produção + saldo do 1º pagamento',true)+tile('Bônus da produção (kg)',brl(calc),'desde 09/11')+tile('Cobertura até 08/11 não paga',brl(sum(ps,'ajuste')),'somada');
  const head = pago()
   ? '<th class="r">Salário</th><th class="r">Bônus pago</th><th class="r">Total recebido</th><th class="r">Cobertura executada, não paga</th>'
   : '<th class="r">Salário</th><th class="r">Bônus (kg)</th><th class="r">Cobertura até 08/11</th><th class="r">Bônus a pagar</th><th class="r">Total previsto</th>';
  const cells = p => pago()
   ? `<td class="r">${brl(p.salario)}</td><td class="r">${brl(p.pago)}</td><td class="r"><b>${brl(p.salario+p.pago)}</b></td><td class="r">${brl(p.saldo)}</td>`
   : `<td class="r">${brl(p.salario)}</td><td class="r">${brl(p.calcKg)}</td><td class="r">${brl(p.ajuste)}</td><td class="r">${brl(p.aPagar)}</td><td class="r"><b>${brl(p.salario+p.aPagar)}</b></td>`;
  $('#app').innerHTML=`
  <h1>Equipe – visão geral</h1>
  <p class="sub">${esc(PER.nome)} · ${dd(PER.ini)} a ${dd(PER.fim)} · ${PER.diasUteis} dias úteis · ${ps.length} profissionais</p>
  <div class="grid tiles">${tiles}
    ${tile('Kg levantado no período',kg(lev),`${kg(lev/PER.diasUteis)} por dia útil`)}
    ${tile('Kg montado no período',kg(mon),`${kg(mon/PER.diasUteis)} por dia útil`)}
  </div>
  ${avisoPeriodo()}
  <div class="card mt"><h2>Profissionais</h2><p class="cap">Clique numa linha para abrir o painel individual.</p>
   <table><thead><tr><th>Nome</th><th>Função</th>${head}</tr></thead><tbody>
   ${ps.map(p=>`<tr class="click" onclick="location.hash='#/${PER.id}/${slug(p.nome)}'"><td><b>${esc(p.nome)}</b></td><td>${esc(p.funcao)}</td>${cells(p)}</tr>`).join('')}
   </tbody></table></div>
  <div class="grid two mt">
    <div class="card"><h2>Produção da equipe por dia</h2><p class="cap">Kg de aço montado (panelização) e levantado (elevação), paredes + cobertura</p>
      ${legend([['Montado',css('--series-1')],['Levantado',css('--series-2')]])}<div id="c1"></div></div>
    <div class="card"><h2>Avanço da estrutura</h2><p class="cap">Acumulado da obra (todos os períodos)</p>${progress()}</div>
  </div>`;
  groupedBars($('#c1'),[{name:'Montado',values:teamMont,color:css('--series-1')},{name:'Levantado',values:teamLev,color:css('--series-2')}],kg);
}
function pagePessoa(p){
  const daily=p.daily; let acc=0; const cum=daily.map(v=>acc+=v);
  const rows=p.porServico.slice().sort((a,b)=>b.valor-a.valor);
  const melhor=daily.reduce((b,v,i)=>v>daily[b]?i:b,0);
  const diasProd=daily.filter(v=>v>0).length;
  const tiles = pago()
   ? tile('Total recebido em 05/11',brl(p.salario+p.pago),`salário ${brl(p.salario)} + bônus ${brl(p.pago)}`,true)+tile('Bônus pago (paredes)',brl(p.pago),'= produção das paredes até 08/11')+tile('Executado e ainda não pago',brl(p.saldo),'cobertura · entra em 05/12')
   : tile('Previsto para 05/12',brl(p.salario+p.aPagar),`salário ${brl(p.salario)} + bônus ${brl(p.aPagar)}`,true)+tile('Bônus da produção (kg)',brl(p.calcKg),'desde 09/11')+tile('Cobertura até 08/11 não paga',brl(p.ajuste),'somada')+tile('Bônus a pagar',brl(p.aPagar),'produção + cobertura pendente')+tile('Salário do mês',brl(p.salario));
  $('#app').innerHTML=`
  <h1>${esc(p.nome)}</h1>
  <p class="sub">${esc(p.funcao)} · ${esc(PER.nome)} · ${dd(PER.ini)} a ${dd(PER.fim)}</p>
  <div class="grid tiles">${tiles}</div>
  <div class="grid two mt">
    <div class="card"><h2>Bônus acumulado no período</h2><p class="cap">Quanto o bônus foi crescendo a cada dia de produção · melhor dia: ${dd(D[melhor])} (${brl(daily[melhor])})</p><div id="c2"></div></div>
    <div class="card"><h2>De onde vem o bônus</h2><p class="cap">${pago()?'Serviços pagos em 05/11':'Por serviço medido no período'}</p><div id="c3"></div>${pago()&&p.pendente?`<p class="cap mt"><b>Executado até 08/11 e ainda não pago</b> (entra em 05/12)</p>`+p.pendente.map(r=>`<div class="row"><span>${esc(r.nome)}</span><span>${brl(r.valor)}</span></div>`).join(''):''}</div>
  </div>
  <div class="grid two mt">
    <div class="card"><h2>Produção da equipe por dia</h2><p class="cap">O bônus é calculado sobre a produção da equipe em que ${esc(p.nome)} trabalhou</p>
      ${legend([['Montado',css('--series-1')],['Levantado',css('--series-2')]])}<div id="c1"></div></div>
    <div class="card"><h2>Como o bônus é calculado</h2>
      <div class="formula">
      Bônus = <b>produção (kg ou m²)</b> × <b>valor da função</b> × <b>presença</b> × <b>desempenho</b><br>
      ${rows.map(r=>`${esc(r.nome)}: ${r.qtd.toLocaleString('pt-BR',{maximumFractionDigits:1})} ${r.un} × ${r.rate.toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:3})} = ${brl(r.valor)}`).join('<br>')}<br>
      Total = <b>${brl(p.calcKg)}</b>${pago()?' (valor pago em 05/11)':''}<br><br>
      Valores do ${esc(p.funcao.toLowerCase())} por kg (convertidos da tabela por m²):<br>
      ${DATA.servicosKg.map(s=>`${esc(s.nome)}: <b>${(s.rate[p.funcao]||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:3})}/kg</b>`).join('<br>')}
      </div>
      ${progress()}
    </div>
  </div>
  <div class="card mt"><details><summary>Ver tabela dia a dia (${diasProd} dias com produção)</summary>
    <table class="mt"><thead><tr><th>Dia</th><th class="r">Kg montado</th><th class="r">Kg levantado</th><th class="r">Bônus do dia</th><th class="r">Acumulado</th></tr></thead><tbody>
    ${D.map((d,i)=>`<tr><td>${dd(d)}</td><td class="r">${kg(teamMont[i])}</td><td class="r">${kg(teamLev[i])}</td><td class="r">${brl(daily[i])}</td><td class="r">${brl(cum[i])}</td></tr>`).join('')}
    </tbody></table></details></div>`;
  lineChart($('#c2'),cum,css('--series-1'),brl,'Bônus acumulado');
  hbars($('#c3'),rows,css('--series-1'));
  groupedBars($('#c1'),[{name:'Montado',values:teamMont,color:css('--series-1')},{name:'Levantado',values:teamLev,color:css('--series-2')}],kg);
}
function route(){
  const parts=location.hash.replace(/^#\/?/,'').split('/');
  setPeriod(parts[0]||DATA.periodos[0].id);
  const p=PER.pessoas.find(x=>slug(x.nome)===parts[1]);
  const per=DATA.periodos.map(x=>`<a href="#/${x.id}${p?'/'+slug(p.nome):''}" class="${x===PER?'on':''}">${esc(x.tipo==='pago'?'Pago 05/11':'Próximo 05/12')}</a>`).join('');
  $('#nav').innerHTML=per+`<span style="width:12px"></span><a href="#/${PER.id}" class="${p?'':'on'}">Equipe</a>`+PER.pessoas.map(x=>`<a href="#/${PER.id}/${slug(x.nome)}" class="${p===x?'on':''}">${esc(x.nome)}</a>`).join('');
  p?pagePessoa(p):pageEquipe(); window.scrollTo(0,0);
}
$('#brand').innerHTML=`MO Steel · Bonificação<small>${esc(DATA.obra)} · Steel Frame</small>`;
$('#foot').textContent=`Dados da planilha Bonificacao_Steel_por_kg.xlsx · atualizado em ${DATA.gerado}. Valores por kg = tabela da Construtora Neto Lara por m² ÷ kg/m² real da obra (paredes ${DATA.kgM2.Parede.toFixed(2)} kg/m², cobertura ${DATA.kgM2.Cobertura.toFixed(2)} kg/m²).`;
addEventListener('hashchange',route);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',route);
route();
</script>
</body>
</html>
